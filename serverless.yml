service: ralph-serverless-payroll-api

provider:
    name: aws
    region: ap-southeast-2
    stage: dev
    runtime: provided.al2
    environment:
        S3_BUCKET_NAME: ralph-payroll-bucket
    iam:
        role:
            statements:
                - Effect: Allow
                  Action:
                      - s3:PutObject
                  Resource: "arn:aws:s3:::ralph-payroll-bucket/payslips/*"

plugins:
    - ./vendor/bref/bref

functions:
    api:
        handler: index.php
        description: 'Serverless Payroll Management API'
        timeout: 28 # API Gateway maximum timeout
        layers:
            - ${bref:layer.php-82-fpm}
        events:
            - httpApi: '*'

# Exclude local git/test files, but KEEP data/*.csv!
package:
    patterns:
        - '!node_modules/**'
        - '!.git/**'
        - '!tests/**'